<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leon's Tools</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    color: #222;
  }

  .page {
    text-align: center;
    padding: 24px;
    width: 100%;
    max-width: 420px;
  }

  h1 {
    font-size: 24px;
    margin: 0 0 28px;
  }

  /* Container that holds all the page-link buttons, stacked and centered */
  .button-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* ============================================================
     COPYABLE BUTTON BLOCK
     Copy the <div class="button-item"> ... </div> block below,
     paste it again inside .button-list, then just change:
       - href  -> the page it should link to
       - text  -> the label shown on the button
     to add a new page to this home screen.
     ============================================================ */
  .button-item {
    width: 100%;
  }
  .button-item a {
    display: block;
    width: 100%;
    padding: 14px 20px;
    background: #ffffff;
    border: 1px solid #ccc;
    border-radius: 8px;
    color: #222;
    text-decoration: none;
    font-size: 16px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .button-item a:hover {
    background: #eee;
    border-color: #999;
  }
</style>
</head>
<body>

  <div class="page">
    <h1>Leon's Tools</h1>

    <div class="button-list">

      <!-- ===== COPY FROM HERE ===== -->
      <div class="button-item">
        <a href="mahjong.html">Mahjong Calculator</a>
      </div>
      <!-- ===== TO HERE, TO ADD ANOTHER PAGE BUTTON ===== -->

    </div>
  </div>

</body>
</html>
